# Show the dongle's own battery level
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

# Enable the WPM widget
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# Layer-name appearance
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="left"
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_NAME_SCROLL_WIDTH=50
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y

# Increase Bluetooth buffers for two split peripherals on ZMK v0.3
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# Optional: disable host-facing Bluetooth battery reporting
CONFIG_BT_BAS=n
